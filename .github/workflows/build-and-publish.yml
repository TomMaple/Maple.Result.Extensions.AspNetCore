# This workflow will build and publish a NuGet library
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and publish

on:
  push:
    branches: [ "**" ]
    paths: [ "src/**", "tests/**", ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]

env:
  ARTIFACTS_PATH: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Detect changes in the src folder
      id: src_changes
      shell: bash
      run: |
        if [ "${EVENT_NAME}" != "push" ]; then
          # Only push events publish, so the comparison is not needed anywhere else.
          CHANGED=false
        elif [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
          # The branch was just created, so there is no previous head to compare against.
          # Assume the src folder changed, so that a publishable change is never silently skipped.
          CHANGED=true
        elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
          # The previous head is unreachable, which happens after a force push.
          CHANGED=true
        elif [ -n "$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- src)" ]; then
          CHANGED=true
        else
          CHANGED=false
        fi
        echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
        echo "Changes in the src folder: ${CHANGED}"
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}

    - name: Get semantic version
      uses: paulhatch/semantic-version@v5.4.0
      id: semantic_version
      with:
        tag_prefix: "v"
        major_pattern: "/!:|BREAKING CHANGE:/"
        minor_pattern: "/feat(\\(.+\\))?:/"
        bump_each_commit: true

    - name: Generate final version
      id: calculate_version
      run: |
        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          echo "package_version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "informational_version=${SEMVER}+${COMMIT}" >> $GITHUB_OUTPUT
        else
          CLEAN_BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's|^[^/]*\/||' | tr '[:upper:]' '[:lower:]' | tr -c '0-9a-z.-' '-')
          echo "package_version=${SEMVER}-${CLEAN_BRANCH}" >> $GITHUB_OUTPUT
          echo "informational_version=${SEMVER}-${CLEAN_BRANCH}+${COMMIT}" >> $GITHUB_OUTPUT
        fi
      env:
        SEMVER: ${{ steps.semantic_version.outputs.version }}
        COMMIT: ${{ steps.semantic_version.outputs.current_commit }}

    - name: Display calculated version
      run: |
        echo "Package version: ${{ steps.calculate_version.outputs.package_version }}"
        echo "Informational version: ${{ steps.calculate_version.outputs.informational_version }}"
      shell: bash

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -p:Version=${{ steps.calculate_version.outputs.package_version }} -p:InformationalVersion=${{ steps.calculate_version.outputs.informational_version }} --configuration Release --verbosity normal

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Generate NuGet package
      run: dotnet pack src/Maple.Result.Extensions.AspNetCore/Maple.Result.Extensions.AspNetCore.csproj --no-build -o ${{ env.ARTIFACTS_PATH }} -p:Version=${{ steps.calculate_version.outputs.package_version }} -p:InformationalVersion=${{ steps.calculate_version.outputs.informational_version }} --configuration Release

    - name: NuGet login
      if: github.ref == 'refs/heads/main' && steps.src_changes.outputs.changed == 'true'
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      if: github.ref == 'refs/heads/main' && steps.src_changes.outputs.changed == 'true'
      run: dotnet nuget push ${{ env.ARTIFACTS_PATH }}/*.nupkg --api-key ${{steps.nuget_login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
